plugins {
    id 'com.android.application'
}

android {
    namespace 'com.waha.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.waha.app"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    /* التوقيع: المفتاح يأتي من أسرار GitHub (انظر SIGNING-AR.md في جذر المستودع)،
       ولا يُحفظ في المستودع أبداً. المفتاح نفسه في كل نسخة، فتُثبَّت كل نسخة فوق السابقة دون فقد البيانات. */
    def ks = System.getenv("WAHA_KEYSTORE")
    signingConfigs {
        // مفتاح تجريبي ثابت داخل المستودع (ليس سرًّا): يجعل نسخ waha-debug.apk تُثبَّت فوق بعضها قبل إضافة مفتاح النشر
        fixedDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv("WAHA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("WAHA_KEY_ALIAS")
                keyPassword System.getenv("WAHA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
        // نسخة الاختبار على الهاتف الافتراضي: بالمفتاح نفسه، ليُختبر تثبيت تحديث فوق نسخة سابقة
        debug {
            signingConfig ks ? signingConfigs.release : signingConfigs.fixedDebug
        }
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
