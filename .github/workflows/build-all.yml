# بناء كل نسخ «واحة اللسان العربي» من مصدر واحد (web/) مع كل رفع إلى main:
#   1) اختبار الدخان (رحلة طفل كاملة في المتصفح) — لا يُبنى شيء إن فشل
#   2) أندرويد APK موقّع بالمفتاح الثابت. قبل إضافة المفاتيح تُبنى نسخة تجريبية للفحص فقط: تبقى مرفقًا في صفحة التشغيل
#      ولا تُنشر في Releases، لأن مفتاحها التجريبي في المستودع، فأيّ أحد يستطيع أن يوقّع به تطبيقًا يُثبََّت فوقها ويقرأ بياناتها.
#   3) ويندوز ولينكس (Electron)، وملفات الويب
#   4) إصدار في صفحة Releases باسم رقم النسخة، فيه كل الملفات. نسخةٌ نُشرت لا تُستبدل ملفاتها: دمجٌ بلا رفع versionName لا يُصدر شيئًا.
# المصدر في src/، وweb/ (إلا web/tests) يُبنى منه: python3 src/tools/build.py ثم python3 src/tools/publish.py
#   الواحة web/index.html، و«كنوز البيان» web/kunuz/، والحسنية web/hasaniya/ (نسخة مثبّتة من مستودعها + طبقة تكامل)، وعامل خدمة واحد web/sw.js.
#   مهمة e2e تتحقق أن web/ هو ناتج src/ فعلًا، ثم تشغّل اختبارات التطبيق كلها (src/tools/test_all.py).
name: Build all

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# one run at a time on main: two quick merges must not race to publish the same release
concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_VERSION: 37.3.1
  # حزمة التلاوة (audio-pack.yml): تُوضع في web/audio/ قبل بناء كل نسخة. إن لم تُنشر بعدُ بُنيت النسخ بلا تلاوة
  AUDIO_TAG: audio-v1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Smoke test (child journey)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node web/tests/smoke.js

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: web/ is what src/ builds
        run: |
          python3 src/tools/build.py
          python3 src/tools/publish.py --check
      - name: End-to-end tests (family profiles, oasis, كنوز البيان, Hasaniya, consent, backup, offline, recovery code)
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python3 src/tools/test_all.py

  android:
    needs: [test, e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Recitation pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "$AUDIO_TAG" -p waha-audio.zip -D "$RUNNER_TEMP" --clobber; then
            unzip -q -o "$RUNNER_TEMP/waha-audio.zip" -d web && du -sh web/audio
          else
            echo "::warning::حزمة التلاوة ($AUDIO_TAG) لم تُنشر بعد، فتُبنى هذه النسخة بلا تلاوة. شغّلوا «Audio pack» من صفحة Actions."
          fi
      - name: Copy web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/index.html web/sw.js web/manifest.json web/js web/fonts web/kunuz web/hasaniya $( [ -d web/audio ] && echo web/audio ) android/app/src/main/assets/www/
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.WAHA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/waha.jks"
            echo "path=$RUNNER_TEMP/waha.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::لم تُضف أسرار التوقيع؛ ستُبنى نسخة تجريبية للفحص فقط ولن تُنشر في Releases. انظر SIGNING-AR.md"
          fi
      - name: Build signed release APK
        if: steps.key.outputs.path != ''
        working-directory: android
        env:
          WAHA_KEYSTORE: ${{ steps.key.outputs.path }}
          WAHA_KEYSTORE_PASSWORD: ${{ secrets.WAHA_KEYSTORE_PASSWORD }}
          WAHA_KEY_ALIAS: ${{ secrets.WAHA_KEY_ALIAS }}
          WAHA_KEY_PASSWORD: ${{ secrets.WAHA_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out" && cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/waha.apk"
      - name: Build debug APK for testing only (no signing key yet)
        if: steps.key.outputs.path == ''
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/test-only" && cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/test-only/waha-TEST-ONLY-debug.apk"
      - name: Keep the signed APK for the release
        if: steps.key.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: waha-apk
          path: out/waha.apk
      - name: Keep the test APK on this run only (never in Releases)
        if: steps.key.outputs.path == ''
        uses: actions/upload-artifact@v4
        with:
          name: test-only-debug-apk
          path: test-only/*.apk
          retention-days: 7

  packages:
    needs: [test, e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Recitation pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "$AUDIO_TAG" -p waha-audio.zip -D "$RUNNER_TEMP" --clobber; then
            unzip -q -o "$RUNNER_TEMP/waha-audio.zip" -d web && du -sh web/audio
          else
            echo "::warning::حزمة التلاوة ($AUDIO_TAG) لم تُنشر بعد، فتُبنى هذه النسخة بلا تلاوة."
          fi
      - name: Web zip
        run: |
          mkdir -p out
          (cd web && zip -qr ../out/waha-web.zip index.html sw.js manifest.json js fonts kunuz hasaniya $( [ -d audio ] && echo audio ))
      - name: Windows and Linux (Electron)
        run: bash desktop/package.sh "$ELECTRON_VERSION" desk
      - name: Check that the Linux version opens the app
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          sudo apt-get install -y xvfb > /dev/null
          Xvfb :77 -screen 0 1024x768x24 &
          sleep 2
          DISPLAY=:77 desk/waha-linux/Waha --no-sandbox --remote-debugging-port=9333 > /dev/null 2>&1 &
          node desktop/smoke.js
      - name: Zip desktop versions
        run: |
          (cd desk/waha-windows && zip -qry ../../out/waha-windows.zip .)
          (cd desk/waha-linux && zip -qry ../../out/waha-linux.zip .)
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: waha-packages
          path: out/
          retention-days: 2

  # نسخة الويب على GitHub Pages: تُدفع إلى فرع gh-pages فتُفتح من https://feras-glitch.github.io/waha-app/
  pages:
    needs: [test, e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Recitation pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "$AUDIO_TAG" -p waha-audio.zip -D "$RUNNER_TEMP" --clobber; then
            unzip -q -o "$RUNNER_TEMP/waha-audio.zip" -d web && du -sh web/audio
          else
            echo "::warning::حزمة التلاوة ($AUDIO_TAG) لم تُنشر بعد، فتُبنى هذه النسخة بلا تلاوة. شغّلوا «Audio pack» من صفحة Actions."
          fi
      - name: Prepare site
        run: |
          rm -rf site && mkdir -p site
          cp -r web/index.html web/sw.js web/manifest.json web/js web/fonts web/kunuz web/hasaniya $( [ -d web/audio ] && echo web/audio ) site/
          touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true

  release:
    needs: [ android, packages ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "::notice::الإصدار v$V منشورٌ من قبل، فلا يُستبدل. لإصدارٍ جديد ارفعوا versionName وversionCode في android/app/build.gradle."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.skip != '1'
        with:
          path: dist
          pattern: waha-*
          merge-multiple: true
      - name: Publish all versions to Releases
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.v }}"
          APK="- أندرويد: waha.apk"
          [ -f dist/waha.apk ] || APK="- أندرويد: لا ملف بعد؛ يظهر waha.apk بعد إضافة مفتاح التوقيع (SIGNING-AR.md)"
          NOTES="واحة اللسان العربي — النسخة ${{ steps.ver.outputs.v }}
          $APK
          - ويندوز: waha-windows.zip (فك الضغط ثم شغّل Waha.exe)
          - لينكس: waha-linux.zip (فك الضغط ثم شغّل ./Waha)
          - ملفات الويب: waha-web.zip
          آخر تحديث: $(date -u '+%Y-%m-%d %H:%M') UTC"
          ls -la dist
          if ls dist/*debug* > /dev/null 2>&1; then echo "::error::a debug APK must never be published"; exit 1; fi
          gh release create "$TAG" dist/* --title "واحة اللسان العربي $TAG" --notes "$NOTES" --target "$GITHUB_SHA"
